name: Validate Palace of Messages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check ratings.js
          node --check netlify/functions/ratings.js
          node --check functions/api/ratings.js
      - name: Verify required project files
        run: |
          test -s index.html
          test -s style.css
          test -s assets/doors-sprite.jpg
          test -s assets/palace-welcome-background.jpg
          grep -q 'src="./ratings.js"' index.html
          grep -q 'from = "/api/ratings"' netlify.toml
